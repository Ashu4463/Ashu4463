name: Live server status

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    paths:
      - "scripts/generate-status.py"
      - ".github/workflows/server-status.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate status SVG
        run: python3 scripts/generate-status.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/server-status.svg
          git diff --cached --quiet || git commit -m "chore: refresh live server status [skip ci]"
          git push
